<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640"><title>КПТ-дневник / в Telegram — иллюстрация</title><g font-family="Inter,Arial,sans-serif"><rect width="1000" height="640" fill="#faf7ef"/><path d="M54 56H151" stroke="#e8b31a" stroke-width="6"/><text x="54" y="104" font-size="16" fill="#885800" font-weight="700">ПРОТОТИП / САМОРЕФЛЕКСИЯ</text><text x="54" y="210" font-size="51" fill="#181b2a" font-weight="700">КПТ-дневник</text><text x="54" y="276" font-size="51" fill="#181b2a" font-weight="700">в Telegram</text><text x="56" y="370" font-size="24" fill="#626575" font-weight="400">Записать. Осмыслить.</text><text x="56" y="406" font-size="24" fill="#626575" font-weight="400">Вернуться к мысли.</text><path d="M56 480H475" stroke="#dfd3b7"/><text x="56" y="525" font-size="16" fill="#885800" font-weight="700">AI / AUTOMATION</text><text x="56" y="563" font-size="15" fill="#626575" font-weight="400">Редакционная иллюстрация · не интерфейс</text><rect x="595" y="160" width="290" height="370" rx="14" fill="white" stroke="#dfd3b7"/><path d="M640 160V530" stroke="#e8b31a" stroke-width="3"/><text x="665" y="225" font-size="20" fill="#885800" font-weight="700">ДНЕВНИК</text><path d="M665 265H856" stroke="#dfd3b7" stroke-width="3"/><path d="M665 303H856" stroke="#dfd3b7" stroke-width="3"/><path d="M665 341H856" stroke="#dfd3b7" stroke-width="3"/><path d="M665 379H856" stroke="#dfd3b7" stroke-width="3"/><path d="M665 417H856" stroke="#dfd3b7" stroke-width="3"/><path d="M665 455H856" stroke="#dfd3b7" stroke-width="3"/><path d="M790 475L925 230L948 243L813 488Z" fill="#e8b31a"/></g></svg>