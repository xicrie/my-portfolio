<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1120" viewBox="0 0 720 1120"><title>Компоненты Ecoute и адаптированного AI-суфлёра</title><rect width="720" height="1120" fill="#faf7ef"/><g font-family="Inter,Arial,sans-serif" fill="#181b2a"><text x="32" y="50" font-size="25" font-weight="700">AI-СУФЛЁР / АРХИТЕКТУРА</text><text x="32" y="85" font-size="18">По исходникам. Windows runtime не проверен.</text><rect x="32" y="120" width="656" height="122" rx="18" fill="white" stroke="#dfd3b7"/><text x="54" y="154" font-size="23" font-weight="700">Основа Ecoute</text><text x="54" y="190" font-size="20" fill="#626575">Микрофон You + WASAPI Speaker</text><text x="54" y="218" font-size="20" fill="#626575">AudioRecorder → две очереди аудио</text><path d="M360 245v26m-7-7 7 7 7-7" fill="none" stroke="#885800" stroke-width="2"/><rect x="32" y="275" width="656" height="122" rx="18" fill="white" stroke="#dfd3b7"/><text x="54" y="309" font-size="23" font-weight="700">Транскрипция</text><text x="54" y="345" font-size="20" fill="#626575">AudioTranscriber → Whisper API</text><text x="54" y="373" font-size="20" fill="#626575">либо multilingual faster-whisper</text><path d="M360 400v26m-7-7 7 7 7-7" fill="none" stroke="#885800" stroke-width="2"/><rect x="32" y="430" width="656" height="122" rx="18" fill="white" stroke="#dfd3b7"/><text x="54" y="464" font-size="23" font-weight="700">Слой диалога адаптированной версии</text><text x="54" y="500" font-size="20" fill="#626575">Шум / повторы / межканальное эхо</text><text x="54" y="528" font-size="20" fill="#626575">Последний Speaker-вопрос → стабилизация</text><path d="M360 555v26m-7-7 7 7 7-7" fill="none" stroke="#885800" stroke-width="2"/><rect x="32" y="585" width="656" height="122" rx="18" fill="white" stroke="#dfd3b7"/><text x="54" y="619" font-size="23" font-weight="700">Контекст из PDF</text><text x="54" y="655" font-size="20" fill="#626575">PyPDF2 → фрагменты 850 / overlap 160</text><text x="54" y="683" font-size="20" fill="#626575">Лексическая релевантность, не embeddings</text><path d="M360 710v26m-7-7 7 7 7-7" fill="none" stroke="#885800" stroke-width="2"/><rect x="32" y="740" width="656" height="122" rx="18" fill="white" stroke="#dfd3b7"/><text x="54" y="774" font-size="23" font-weight="700">Генерация ответа</text><text x="54" y="810" font-size="20" fill="#626575">Вопрос + недавний диалог + PDF-контекст</text><text x="54" y="838" font-size="20" fill="#626575">GPT-4o-mini → 1–3 предложения</text><path d="M360 865v26m-7-7 7 7 7-7" fill="none" stroke="#885800" stroke-width="2"/><rect x="32" y="895" width="656" height="122" rx="18" fill="white" stroke="#dfd3b7"/><text x="54" y="929" font-size="23" font-weight="700">UI адаптированной версии</text><text x="54" y="965" font-size="20" fill="#626575">CustomTkinter: транскрипция и AI-ответ</text><text x="54" y="993" font-size="20" fill="#626575">Закрепление / прозрачность / фокус</text><text x="32" y="1080" font-size="17" fill="#885800">Локальная ASR не отменяет сетевой вызов генерации ответа.</text></g></svg>