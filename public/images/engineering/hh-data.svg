<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1009" viewBox="0 0 720 1009" role="img"><title>Архитектура данных HH Career Engine</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#a87b00"/></marker></defs><rect width="100%" height="100%" fill="#f9f7f2"/><g font-family="Inter,Arial,sans-serif"><text x="32" y="52" font-size="22" fill="#181b2a" font-weight="700">HH / КАРТА ДАННЫХ</text><text x="32" y="86" font-size="17" fill="#626575" font-weight="400">Компоненты и контракты по исходникам</text><rect x="32" y="120" width="656" height="120" rx="18" fill="white" stroke="#d9d3c8"/><text x="54" y="156" font-size="24" fill="#181b2a" font-weight="700">Входные источники</text><text x="54" y="190" font-size="20" fill="#626575" font-weight="400">HH API: карточка вакансии и работодатель</text><text x="54" y="219" font-size="20" fill="#626575" font-weight="400">Профиль: факты, ID, цитаты, hash</text><path d="M360 243V269" stroke="#a87b00" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="278" width="656" height="120" rx="18" fill="white" stroke="#d9d3c8"/><text x="54" y="314" font-size="24" fill="#181b2a" font-weight="700">Контроль и анализ</text><text x="54" y="348" font-size="20" fill="#626575" font-weight="400">constraints → LLM JSON → проверка оснований</text><text x="54" y="377" font-size="20" fill="#626575" font-weight="400">scoring → APPLY / REVIEW / SKIP</text><path d="M360 401V427" stroke="#a87b00" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="436" width="656" height="120" rx="18" fill="white" stroke="#d9d3c8"/><text x="54" y="472" font-size="24" fill="#181b2a" font-weight="700">Подготовка действия</text><text x="54" y="506" font-size="20" fill="#626575" font-weight="400">письмо → локальные проверки → AI-review</text><text x="54" y="535" font-size="20" fill="#626575" font-weight="400">dry-run или safe_send → статус исполнения</text><path d="M360 559V585" stroke="#a87b00" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="594" width="656" height="207" rx="18" fill="white" stroke="#d9d3c8"/><text x="54" y="630" font-size="24" fill="#181b2a" font-weight="700">SQLite / WAL</text><text x="54" y="664" font-size="20" fill="#626575" font-weight="400">evaluations — снимки и решения</text><text x="54" y="693" font-size="20" fill="#626575" font-weight="400">cache — ключ входа, модели и версии</text><text x="54" y="722" font-size="20" fill="#626575" font-weight="400">pending — отложенные вакансии</text><text x="54" y="751" font-size="20" fill="#626575" font-weight="400">sends — sending / applied / unknown</text><text x="54" y="780" font-size="20" fill="#626575" font-weight="400">feedback + ai_usage — предпочтения и бюджет</text><path d="M360 804V830" stroke="#a87b00" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="839" width="656" height="120" rx="18" fill="white" stroke="#d9d3c8"/><text x="54" y="875" font-size="24" fill="#181b2a" font-weight="700">Выход для пользователя</text><text x="54" y="909" font-size="20" fill="#626575" font-weight="400">Markdown / JSON / JSONL</text><text x="54" y="938" font-size="20" fill="#626575" font-weight="400">объяснение, письмо, история и статус</text></g></svg>